<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>继续教育学分管理平台</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #0f6bff 0%, #16b8a6 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #1f2937;
    }
    .card {
      width: 100%;
      max-width: 720px;
      background: #fff;
      border-radius: 20px;
      padding: 40px 32px;
      box-shadow: 0 24px 60px rgba(15, 43, 90, 0.25);
      text-align: center;
    }
    h1 { margin: 0 0 8px; font-size: 26px; color: #0f3d91; }
    .sub { margin: 0 0 28px; color: #6b7280; font-size: 14px; }
    .entries { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    a.entry {
      display: block;
      padding: 24px 18px;
      border-radius: 14px;
      text-decoration: none;
      color: #fff;
      transition: transform .15s ease, box-shadow .15s ease;
    }
    a.entry:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(15, 107, 255, .3); }
    .admin { background: linear-gradient(135deg, #2563eb, #1d4ed8); }
    .mobile { background: linear-gradient(135deg, #10b981, #059669); }
    .entry .name { font-size: 18px; font-weight: 600; margin-bottom: 6px; }
    .entry .desc { font-size: 12px; opacity: .85; }
    .accounts {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid #e5e7eb;
      font-size: 12px;
      color: #6b7280;
      line-height: 1.9;
      text-align: left;
    }
    .accounts b { color: #374151; }
    code { background: #f3f4f6; padding: 1px 6px; border-radius: 4px; color: #0f3d91; }
    @media (max-width: 520px) {
      .card { padding: 28px 20px; }
      .entries { grid-template-columns: 1fr; }
      h1 { font-size: 22px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>继续教育学分管理平台</h1>
    <p class="sub">在线学习 · 学分管理 · 毕业审核 · 统计报表</p>

    <div class="entries">
      <a class="entry admin" href="/admin/">
        <div class="name">管理后台</div>
        <div class="desc">PC 端 · 培训班 / 课程 / 学分 / 报表</div>
      </a>
      <a class="entry mobile" href="/m/">
        <div class="name">学员移动端</div>
        <div class="desc">H5 · 视频学习 / 考试 / 毕业申请</div>
      </a>
    </div>

    <div class="accounts">
      <div><b>演示账号</b></div>
      <div>管理员：<code>admin / admin123</code></div>
      <div>领导：<code>leader / leader123</code>　教员：<code>teacher / teacher123</code></div>
      <div>学员：<code>student / student123</code></div>
    </div>
  </main>
</body>
</html>
