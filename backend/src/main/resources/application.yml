server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: adult-education-credit-platform
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/adult_edu?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&allowMultiQueries=true
    username: root
    password:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 10000
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
      continue-on-error: false
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      timeout: 3s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 520MB
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    secret: adult-education-credit-platform-2026-secret-key-for-hs256-signing
    expire-hours: 12
  upload:
    dir: ./data/uploads
    max-image-size: 5MB
  security:
    max-login-fail: 5
    lock-minutes: 15
    gateway: 180
  study:
    heartbeat-seconds: 30
    popup-min-seconds: 300
    popup-max-seconds: 600
    popup-timeout-seconds: 60
    verify-timeout-seconds: 60
    max-verify-fail: 3
  face:
    # 本地演示模式：不调用第三方人脸服务，按图片特征给出模拟相似度
    mock: true
    threshold: 0.75
    mock-pass-similarity: 0.92
    mock-fail-similarity: 0.32
  sms:
    mock: true
    code-expire-seconds: 300
    resend-seconds: 60
    daily-limit: 10
  certificate:
    no-prefix: JXJY
  wechat:
    mock: true
